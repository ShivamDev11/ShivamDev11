name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write   # 🔥 VERY IMPORTANT

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4   # ✅ IMPORTANT

      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: ShivamDev11
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg

      - name: Deploy to output branch
        uses: peaceiris/actions-gh-pages@v4   # ✅ UPDATED VERSION
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
